<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="template:media-width" content="1080">
<meta name="template:media-height" content="1920">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width:1080px; height:1920px;
  background: radial-gradient(ellipse at 50% 30%, #1a1a2e 0%, #0a0a10 70%);
  font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; color:#fff; overflow:hidden;
}
.hero-image { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.hero-image img { width:100%; height:100%; object-fit:cover; opacity:0.6; }
.gradient-overlay { position:absolute; inset:0; background:linear-gradient(180deg, transparent 40%, rgba(10,10,20,0.9) 85%); }
.product-badge { position:absolute; top:120px; left:80px; padding:14px 32px; background:rgba(59,130,246,0.9); border-radius:8px; font-size:28px; font-weight:700; letter-spacing:4px; }
.title-text { position:absolute; bottom:480px; left:80px; right:80px; font-size:56px; font-weight:800; line-height:1.3; text-shadow:0 4px 20px rgba(0,0,0,0.8); }
.subtitle-text { position:absolute; bottom:360px; left:80px; right:80px; font-size:36px; color:rgba(255,255,255,0.8); line-height:1.5; }
.spec-bar { position:absolute; bottom:200px; left:80px; right:80px; display:flex; gap:40px; }
.spec-item { flex:1; text-align:center; }
.spec-icon { font-size:48px; margin-bottom:8px; }
.spec-label { font-size:22px; color:rgba(255,255,255,0.5); }
.spec-value { font-size:28px; font-weight:600; margin-top:4px; }
.bottom-gradient { position:absolute; bottom:0; left:0; right:0; height:4px; background:linear-gradient(90deg, #3B82F6, #8B5CF6, #EC4899); }
</style>
</head>
<body>
{{#image}}<div class="hero-image"><img src="{{image}}"></div>{{/image}}
<div class="gradient-overlay"></div>
<div class="product-badge">PRODUCT SHOWCASE</div>
<div class="title-text">{{prompt_text}}</div>
<div class="subtitle-text">{{subtitle_text}}</div>
<div class="spec-bar">
  <div class="spec-item"><div class="spec-icon">🎥</div><div class="spec-label">运镜</div><div class="spec-value">{{camera}}</div></div>
  <div class="spec-item"><div class="spec-icon">✨</div><div class="spec-label">特效</div><div class="spec-value">{{visual_fx}}</div></div>
  <div class="spec-item"><div class="spec-icon">😊</div><div class="spec-label">情绪</div><div class="spec-value">{{emotion}}</div></div>
  <div class="spec-item"><div class="spec-icon">⏱</div><div class="spec-label">时长</div><div class="spec-value">{{duration}}s</div></div>
</div>
<div class="bottom-gradient"></div>
</body>
</html>
